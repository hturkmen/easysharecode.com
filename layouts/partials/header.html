<header class="bg-white shadow-sm sticky top-0 z-50">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8" aria-label="{{ i18n "nav_home" }} navigation">
    <div class="flex items-center justify-between h-16">
      <!-- Logo + Brand Name -->
      <div class="flex-shrink-0">
        <a href="{{ .Site.Home.RelPermalink }}" class="flex items-center space-x-2 text-primary-700 hover:text-primary-800 transition-colors">
          <img src="/images/logo.png" alt="Easy Share Code logo" class="h-8 w-8" width="32" height="32" loading="eager">
          <span class="text-xl font-bold">Easy Share Code</span>
        </a>
      </div>

      <!-- Desktop Navigation Links -->
      <div class="hidden md:flex md:items-center md:space-x-8">
        <a href="{{ .Site.Home.RelPermalink }}" class="text-gray-700 hover:text-primary-600 font-medium transition-colors">
          {{ i18n "nav_home" }}
        </a>
        <a href="#features" class="text-gray-700 hover:text-primary-600 font-medium transition-colors">
          {{ i18n "nav_features" }}
        </a>
        <a href="{{ "blog/" | relLangURL }}" class="text-gray-700 hover:text-primary-600 font-medium transition-colors">
          {{ i18n "nav_blog" }}
        </a>
        <a href="{{ .Site.Params.appStoreURL }}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center px-4 py-2 bg-primary-600 text-white font-medium rounded-lg hover:bg-primary-700 transition-colors">
          {{ i18n "nav_download" }}
          <svg class="ml-1.5 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
          </svg>
        </a>
      </div>

      <!-- Language Switcher Placeholder (task 2.2) -->
      <div class="hidden md:block" id="language-switcher-slot">
        {{ partial "language-switcher.html" . }}
      </div>

      <!-- Mobile Hamburger Button -->
      <div class="flex md:hidden">
        <button type="button" id="mobile-menu-button" class="inline-flex items-center justify-center p-2 rounded-md text-gray-700 hover:text-primary-600 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primary-500 transition-colors" aria-controls="mobile-menu" aria-expanded="false" aria-label="Toggle navigation menu">
          <!-- Hamburger icon -->
          <svg id="menu-icon-open" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <!-- Close icon (hidden by default) -->
          <svg id="menu-icon-close" class="hidden h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu (hidden by default) -->
    <div id="mobile-menu" class="hidden md:hidden border-t border-gray-100">
      <div class="px-2 pt-2 pb-3 space-y-1">
        <a href="{{ .Site.Home.RelPermalink }}" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-primary-600 hover:bg-gray-50 transition-colors">
          {{ i18n "nav_home" }}
        </a>
        <a href="#features" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-primary-600 hover:bg-gray-50 transition-colors">
          {{ i18n "nav_features" }}
        </a>
        <a href="{{ "blog/" | relLangURL }}" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-primary-600 hover:bg-gray-50 transition-colors">
          {{ i18n "nav_blog" }}
        </a>
        <a href="{{ .Site.Params.appStoreURL }}" target="_blank" rel="noopener noreferrer" class="block px-3 py-2 rounded-md text-base font-medium text-primary-600 hover:bg-primary-50 transition-colors">
          {{ i18n "nav_download" }}
        </a>
      </div>
      <!-- Mobile Language Switcher Placeholder (task 2.2) -->
      <div class="border-t border-gray-100 px-4 py-3" id="mobile-language-switcher-slot">
        {{ partial "language-switcher.html" . }}
      </div>
    </div>
  </nav>
</header>

<!-- Mobile Menu Toggle Script -->
<script>
  (function() {
    const menuButton = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');
    const iconOpen = document.getElementById('menu-icon-open');
    const iconClose = document.getElementById('menu-icon-close');

    if (menuButton && mobileMenu) {
      menuButton.addEventListener('click', function() {
        const isExpanded = menuButton.getAttribute('aria-expanded') === 'true';
        menuButton.setAttribute('aria-expanded', !isExpanded);
        mobileMenu.classList.toggle('hidden');
        iconOpen.classList.toggle('hidden');
        iconClose.classList.toggle('hidden');
      });

      // Close menu when clicking on anchor links
      mobileMenu.querySelectorAll('a[href^="#"]').forEach(function(link) {
        link.addEventListener('click', function() {
          mobileMenu.classList.add('hidden');
          iconOpen.classList.remove('hidden');
          iconClose.classList.add('hidden');
          menuButton.setAttribute('aria-expanded', 'false');
        });
      });
    }
  })();
</script>
