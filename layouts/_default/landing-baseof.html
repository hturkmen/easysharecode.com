<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="bg-white text-gray-900 font-sans">
  {{/* Minimal header - logo only, no navigation */}}
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="{{ .Site.Home.RelPermalink }}" class="flex items-center space-x-2 text-primary-700 hover:text-primary-800 transition-colors">
          <img src="/images/logo.png" alt="Easy Share Code logo" class="h-8 w-8" width="32" height="32" loading="eager">
          <span class="text-xl font-bold">Easy Share Code</span>
        </a>
        <a href="{{ .Site.Params.appStoreURL }}" target="_blank" rel="noopener noreferrer" class="hidden sm:inline-flex items-center px-4 py-2 bg-primary-600 text-white font-medium rounded-lg hover:bg-primary-700 transition-colors text-sm">
          Download Free
          <svg class="ml-1.5 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>

  {{/* Minimal footer - copyright only */}}
  <footer class="bg-gray-900 text-gray-400 py-6">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm">
      <p>© 2025 Easy Share Code. All rights reserved.</p>
    </div>
  </footer>

  {{/* Sticky mobile CTA bar */}}
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-3 sm:hidden z-50">
    <a href="{{ .Site.Params.appStoreURL }}" target="_blank" rel="noopener noreferrer" class="block w-full text-center px-4 py-3 bg-primary-600 text-white font-semibold rounded-lg hover:bg-primary-700 transition-colors">
      Download Free — App Store
    </a>
  </div>
</body>
</html>
