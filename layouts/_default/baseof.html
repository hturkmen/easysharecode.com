<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="bg-white text-gray-900 font-sans">
  {{/* Skip to main content link for keyboard accessibility (WCAG 2.1 AA) */}}
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[100] focus:bg-blue-600 focus:text-white focus:px-4 focus:py-2 focus:rounded-md focus:text-sm focus:font-medium">
    {{ i18n "skip_to_content" | default "Skip to main content" }}
  </a>
  {{ partial "header.html" . }}
  {{ partial "language-detect.html" . }}
  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
