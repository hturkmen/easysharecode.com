<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background gradient -->
  <rect width="1200" height="630" fill="#2563eb"/>
  <rect width="1200" height="630" fill="url(#ogGrad)" opacity="0.8"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="white" opacity="0.05"/>
  <circle cx="1100" cy="530" r="250" fill="white" opacity="0.05"/>
  <circle cx="900" cy="100" r="150" fill="white" opacity="0.03"/>
  
  <!-- Shield logo (centered, larger) -->
  <g transform="translate(500, 140) scale(3)">
    <path d="M32 4L8 14v18c0 14.4 10.24 27.84 24 32 13.76-4.16 24-17.6 24-32V14L32 4z" fill="white" opacity="0.95"/>
    <path d="M22 28l-6 6 6 6" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 28l6 6-6 6" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 24l-8 16" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="32" cy="20" r="3" fill="#2563eb" opacity="0.9"/>
    <rect x="30.5" y="20" width="3" height="4" rx="1" fill="#2563eb" opacity="0.9"/>
  </g>
  
  <!-- App name -->
  <text x="600" y="440" font-family="SF Pro Display, -apple-system, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="white" text-anchor="middle">Easy Share Code</text>
  
  <!-- Tagline -->
  <text x="600" y="500" font-family="SF Pro Display, -apple-system, Helvetica, Arial, sans-serif" font-size="28" fill="white" opacity="0.85" text-anchor="middle">Manage your UK Home Office share codes securely</text>
  
  <!-- URL -->
  <text x="600" y="580" font-family="SF Pro Display, -apple-system, Helvetica, Arial, sans-serif" font-size="20" fill="white" opacity="0.6" text-anchor="middle">www.easysharecode.com</text>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="ogGrad" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
