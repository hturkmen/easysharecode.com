<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" fill="none">
  <!-- iPhone frame -->
  <rect x="3" y="3" width="234" height="474" rx="33" fill="#1a1a1a"/>
  <rect x="7" y="7" width="226" height="466" rx="30" fill="#000000"/>
  <!-- Screen area -->
  <rect x="10" y="10" width="220" height="460" rx="27" fill="#f8fafc"/>

  <!-- Status bar -->
  <rect x="10" y="10" width="220" height="34" rx="27" fill="#2563eb"/>
  <rect x="90" y="13" width="60" height="18" rx="9" fill="#000000"/>
  <text x="28" y="28" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="white">9:41</text>
  <rect x="195" y="22" width="16" height="7" rx="1.5" stroke="white" stroke-width="1" fill="none"/>
  <rect x="197" y="24" width="11" height="3" rx="1" fill="white"/>

  <!-- Header -->
  <rect x="10" y="44" width="220" height="45" fill="white"/>
  <rect x="10" y="88" width="220" height="1" fill="#e2e8f0"/>
  <text x="24" y="70" font-family="SF Pro, -apple-system, sans-serif" font-size="14" fill="#2563eb">‹</text>
  <text x="72" y="70" font-family="SF Pro, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Reminders</text>

  <!-- Notification banner (push notification style) -->
  <rect x="18" y="98" width="204" height="60" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="18" y="98" width="204" height="60" rx="12" fill="#fef3c7" opacity="0.3"/>
  <circle cx="38" cy="118" r="10" fill="#f59e0b"/>
  <text x="33" y="122" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="white">🔔</text>
  <text x="54" y="115" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#1e293b">Expiry Warning</text>
  <text x="170" y="115" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#64748b">now</text>
  <text x="54" y="128" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#64748b">Benefits Check expires in 2 days.</text>
  <text x="54" y="140" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#64748b">Generate a new code now.</text>

  <!-- Upcoming reminders title -->
  <text x="24" y="180" font-family="SF Pro, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Upcoming Expiry Dates</text>

  <!-- Timeline -->
  <!-- Item 1 - Urgent -->
  <rect x="18" y="192" width="204" height="56" rx="10" fill="white" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="28" y="202" width="4" height="36" rx="2" fill="#ef4444"/>
  <text x="42" y="210" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#ef4444">2 DAYS LEFT</text>
  <text x="42" y="224" font-family="SF Pro, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#1e293b">Benefits Check</text>
  <text x="42" y="238" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#64748b">Expires: 20 Dec 2025</text>
  <rect x="170" y="210" width="40" height="20" rx="10" fill="#fee2e2"/>
  <text x="178" y="223" font-family="SF Pro, -apple-system, sans-serif" font-size="8" font-weight="500" fill="#ef4444">Urgent</text>

  <!-- Item 2 - Warning -->
  <rect x="18" y="256" width="204" height="56" rx="10" fill="white" stroke="#f59e0b" stroke-width="1"/>
  <rect x="28" y="266" width="4" height="36" rx="2" fill="#f59e0b"/>
  <text x="42" y="274" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#f59e0b">10 DAYS LEFT</text>
  <text x="42" y="288" font-family="SF Pro, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#1e293b">Right to Work</text>
  <text x="42" y="302" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#64748b">Expires: 28 Dec 2025</text>
  <rect x="170" y="274" width="40" height="20" rx="10" fill="#fef3c7"/>
  <text x="176" y="287" font-family="SF Pro, -apple-system, sans-serif" font-size="8" font-weight="500" fill="#d97706">Soon</text>

  <!-- Item 3 - OK -->
  <rect x="18" y="320" width="204" height="56" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="28" y="330" width="4" height="36" rx="2" fill="#10b981"/>
  <text x="42" y="338" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#10b981">28 DAYS LEFT</text>
  <text x="42" y="352" font-family="SF Pro, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#1e293b">Right to Rent</text>
  <text x="42" y="366" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#64748b">Expires: 15 Jan 2026</text>
  <rect x="170" y="338" width="40" height="20" rx="10" fill="#dcfce7"/>
  <text x="183" y="351" font-family="SF Pro, -apple-system, sans-serif" font-size="8" font-weight="500" fill="#10b981">OK</text>

  <!-- Item 4 - OK -->
  <rect x="18" y="384" width="204" height="56" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="28" y="394" width="4" height="36" rx="2" fill="#10b981"/>
  <text x="42" y="402" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#10b981">53 DAYS LEFT</text>
  <text x="42" y="416" font-family="SF Pro, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#1e293b">Employer Check</text>
  <text x="42" y="430" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#64748b">Expires: 10 Feb 2026</text>
  <rect x="170" y="402" width="40" height="20" rx="10" fill="#dcfce7"/>
  <text x="183" y="415" font-family="SF Pro, -apple-system, sans-serif" font-size="8" font-weight="500" fill="#10b981">OK</text>
</svg>
