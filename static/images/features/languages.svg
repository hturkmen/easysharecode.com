  <text x="72" y="70" font-family="SF Pro, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Language</text>

  <!-- Search bar -->
  <rect x="18" y="98" width="204" height="32" rx="8" fill="#f1f5f9"/>
  <text x="36" y="118" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="#94a3b8">🔍 Search languages...</text>

  <!-- Language list -->
  <!-- English - Selected -->
  <rect x="18" y="140" width="204" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="32" y="158" font-family="SF Pro, -apple-system, sans-serif" font-size="16">🇬🇧</text>
  <text x="56" y="157" font-family="SF Pro, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e293b">English</text>
  <text x="56" y="172" font-family="SF Pro, -apple-system, sans-serif" font-size="9" fill="#64748b">English</text>
  <circle cx="200" cy="162" r="8" fill="#2563eb"/>
  <path d="M196 162l3 3 5-5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Spanish -->
  <rect x="18" y="192" width="204" height="44" rx="8" fill="white"/>
  <text x="32" y="210" font-family="SF Pro, -apple-system, sans-serif" font-size="16">🇪🇸</text>
  <text x="56" y="209" font-family="SF Pro, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#1e293b">Español</text>
  <text x="56" y="224" font-family="SF Pro, -apple-system, sans-serif" font-size="9" fill="#64748b">Spanish</text>

  <!-- French -->
  <rect x="18" y="244" width="204" height="44" rx="8" fill="white"/>
  <text x="32" y="262" font-family="SF Pro, -apple-system, sans-serif" font-size="16">🇫🇷</text>
  <text x="56" y="261" font-family="SF Pro, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#1e293b">Français</text>
  <text x="56" y="276" font-family="SF Pro, -apple-system, sans-serif" font-size="9" fill="#64748b">French</text>

  <!-- German -->
  <rect x="18" y="296" width="204" height="44" rx="8" fill="white"/>
  <text x="32" y="314" font-family="SF Pro, -apple-system, sans-serif" font-size="16">🇩🇪</text>
  <text x="56" y="313" font-family="SF Pro, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#1e293b">Deutsch</text>
  <text x="56" y="328" font-family="SF Pro, -apple-system, sans-serif" font-size="9" fill="#64748b">German</text>

  <!-- Polish -->
  <rect x="18" y="348" width="204" height="44" rx="8" fill="white"/>
  <text x="32" y="366" font-family="SF Pro, -apple-system, sans-serif" font-size="16">🇵🇱</text>
  <text x="56" y="365" font-family="SF Pro, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#1e293b">Polski</text>
  <text x="56" y="380" font-family="SF Pro, -apple-system, sans-serif" font-size="9" fill="#64748b">Polish</text>

  <!-- Romanian -->
  <rect x="18" y="400" width="204" height="44" rx="8" fill="white"/>
  <text x="32" y="418" font-family="SF Pro, -apple-system, sans-serif" font-size="16">🇷🇴</text>
  <text x="56" y="417" font-family="SF Pro, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#1e293b">Română</text>
  <text x="56" y="432" font-family="SF Pro, -apple-system, sans-serif" font-size="9" fill="#64748b">Romanian</text>

  <!-- More indicator -->
  <text x="120" y="460" font-family="SF Pro, -apple-system, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">+ 26 more languages</text>
