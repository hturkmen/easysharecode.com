<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" fill="none">
  <!-- iPhone frame -->
  <rect x="3" y="3" width="234" height="474" rx="33" fill="#1a1a1a"/>
  <rect x="7" y="7" width="226" height="466" rx="30" fill="#000000"/>
  <!-- Screen area -->
  <rect x="10" y="10" width="220" height="460" rx="27" fill="#f8fafc"/>

  <!-- Status bar -->
  <rect x="10" y="10" width="220" height="34" rx="27" fill="#2563eb"/>
  <rect x="90" y="13" width="60" height="18" rx="9" fill="#000000"/>
  <text x="28" y="28" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="white">9:41</text>
  <rect x="195" y="22" width="16" height="7" rx="1.5" stroke="white" stroke-width="1" fill="none"/>
  <rect x="197" y="24" width="11" height="3" rx="1" fill="white"/>

  <!-- Header -->
  <rect x="10" y="44" width="220" height="45" fill="white"/>
  <rect x="10" y="88" width="220" height="1" fill="#e2e8f0"/>
