<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8fdf5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cce5ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad2)" rx="8"/>
  <!-- Decorative elements -->
  <circle cx="700" cy="80" r="45" fill="#10b981" opacity="0.08"/>
  <circle cx="100" cy="320" r="50" fill="#1a73e8" opacity="0.06"/>
  <!-- House icon (left section) -->
  <g transform="translate(100, 100)">
    <!-- House body -->
    <rect x="30" y="100" width="120" height="100" rx="4" fill="#059669"/>
    <!-- Roof -->
    <polygon points="90,40 20,100 160,100" fill="#10b981"/>
    <!-- Door -->
    <rect x="70" y="140" width="40" height="60" rx="3" fill="#065f46"/>
    <!-- Door handle -->
    <circle cx="100" cy="172" r="4" fill="#fbbf24"/>
    <!-- Window -->
    <rect x="120" y="120" width="20" height="20" rx="2" fill="#a7f3d0"/>
    <!-- Key icon below house -->
    <g transform="translate(55, 215)">
      <circle cx="20" cy="15" r="12" fill="none" stroke="#1a73e8" stroke-width="3"/>
      <line x1="32" y1="15" x2="60" y2="15" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
      <line x1="50" y1="15" x2="50" y2="25" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
      <line x1="58" y1="15" x2="58" y2="22" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Phone with share code (center) -->
  <g transform="translate(320, 70)">
    <rect x="0" y="0" width="140" height="250" rx="18" fill="#1e293b"/>
    <rect x="8" y="18" width="124" height="214" rx="4" fill="#ffffff"/>
    <!-- Phone notch -->
    <rect x="45" y="5" width="50" height="8" rx="4" fill="#374151"/>
    <!-- Screen content -->
    <rect x="20" y="32" width="100" height="18" rx="3" fill="#1a73e8"/>
    <text x="70" y="45" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">SHARE CODE</text>
    <rect x="25" y="60" width="90" height="30" rx="5" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
    <text x="70" y="80" font-family="monospace" font-size="12" fill="#059669" text-anchor="middle" font-weight="bold">A3 8KM 7NP</text>
    <!-- Status indicator -->
    <circle cx="35" cy="110" r="6" fill="#10b981"/>
    <text x="48" y="114" font-family="Arial, sans-serif" font-size="9" fill="#334155">Verified</text>
    <!-- Document lines -->
    <rect x="25" y="130" width="85" height="5" rx="2" fill="#e5e7eb"/>
    <rect x="25" y="142" width="70" height="5" rx="2" fill="#e5e7eb"/>
    <rect x="25" y="154" width="90" height="5" rx="2" fill="#e5e7eb"/>
    <!-- Right to Rent badge -->
    <rect x="25" y="175" width="90" height="40" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="70" y="193" font-family="Arial, sans-serif" font-size="8" fill="#059669" text-anchor="middle" font-weight="bold">RIGHT TO RENT</text>
    <text x="70" y="207" font-family="Arial, sans-serif" font-size="8" fill="#059669" text-anchor="middle">✓ Confirmed</text>
  </g>
  <!-- Document exchange / handshake (right section) -->
  <g transform="translate(540, 110)">
    <!-- Document -->
    <rect x="30" y="20" width="100" height="130" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="45" y="35" width="70" height="8" rx="2" fill="#1a73e8" opacity="0.7"/>
    <rect x="45" y="50" width="60" height="5" rx="2" fill="#e5e7eb"/>
    <rect x="45" y="62" width="65" height="5" rx="2" fill="#e5e7eb"/>
    <rect x="45" y="74" width="50" height="5" rx="2" fill="#e5e7eb"/>
    <!-- Checkmark on document -->
    <circle cx="80" cy="110" r="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <polyline points="70,110 77,118 92,103" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Handshake icon below -->
    <g transform="translate(30, 165)">
      <!-- Left hand -->
      <path d="M 10,30 Q 25,15 45,20 L 55,25" fill="none" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
      <!-- Right hand -->
      <path d="M 90,30 Q 75,15 55,20 L 45,25" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <!-- Clasp -->
      <ellipse cx="50" cy="25" rx="12" ry="8" fill="none" stroke="#334155" stroke-width="2"/>
    </g>
  </g>
  <!-- Connecting arrows -->
  <g opacity="0.6">
    <path d="M 270,200 Q 300,200 320,200" fill="none" stroke="#1a73e8" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="318,195 328,200 318,205" fill="#1a73e8"/>
  </g>
  <g opacity="0.6">
    <path d="M 460,200 Q 500,200 535,200" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="533,195 543,200 533,205" fill="#10b981"/>
  </g>
  <!-- Title text -->
  <text x="400" y="375" font-family="Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="bold">Why You Need a Share Code for Renting</text>
</svg>