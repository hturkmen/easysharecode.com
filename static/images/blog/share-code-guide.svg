<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cce5ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)" rx="8"/>
  <!-- Decorative circles -->
  <circle cx="680" cy="60" r="40" fill="#1a73e8" opacity="0.08"/>
  <circle cx="120" cy="340" r="55" fill="#1a73e8" opacity="0.06"/>
  <!-- Phone -->
  <rect x="320" y="60" width="160" height="280" rx="20" fill="#1e293b"/>
  <rect x="330" y="80" width="140" height="240" rx="4" fill="#ffffff"/>
  <!-- Phone screen content -->
  <rect x="345" y="95" width="110" height="20" rx="3" fill="#1a73e8"/>
  <text x="400" y="110" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">SHARE CODE</text>
  <rect x="350" y="130" width="100" height="35" rx="5" fill="#f0f7ff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="400" y="153" font-family="monospace" font-size="14" fill="#1a73e8" text-anchor="middle" font-weight="bold">W6 7HQ 2KP</text>
  <!-- Gov.uk hint -->
  <rect x="350" y="180" width="100" height="25" rx="4" fill="#0b0c0c"/>
  <text x="400" y="197" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">GOV.UK</text>
  <rect x="350" y="210" width="80" height="6" rx="2" fill="#e0e0e0"/>
  <rect x="350" y="222" width="95" height="6" rx="2" fill="#e0e0e0"/>
  <rect x="350" y="234" width="60" height="6" rx="2" fill="#e0e0e0"/>
  <!-- Phone notch -->
  <rect x="375" y="65" width="50" height="8" rx="4" fill="#374151"/>
  <!-- Step arrows: 1 → 2 → 3 -->
  <!-- Step 1 -->
  <g transform="translate(80, 150)">
    <circle cx="40" cy="40" r="38" fill="#1a73e8" opacity="0.15"/>
    <circle cx="40" cy="40" r="28" fill="#1a73e8"/>
    <text x="40" y="47" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
    <text x="40" y="95" font-family="Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Login</text>
  </g>
  <!-- Arrow 1→2 -->
  <g transform="translate(165, 180)">
    <line x1="0" y1="10" x2="40" y2="10" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="38,4 50,10 38,16" fill="#1a73e8"/>
  </g>
  <!-- Step 2 -->
  <g transform="translate(210, 150)">
    <circle cx="40" cy="40" r="38" fill="#1a73e8" opacity="0.15"/>
    <circle cx="40" cy="40" r="28" fill="#1a73e8"/>
    <text x="40" y="47" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
    <text x="40" y="95" font-family="Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Prove</text>
  </g>
  <!-- Arrow 2→3 (going to right side) -->
  <g transform="translate(500, 180)">
    <line x1="0" y1="10" x2="40" y2="10" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="38,4 50,10 38,16" fill="#1a73e8"/>
  </g>
  <!-- Step 3 -->
  <g transform="translate(550, 150)">
    <circle cx="40" cy="40" r="38" fill="#1a73e8" opacity="0.15"/>
    <circle cx="40" cy="40" r="28" fill="#1a73e8"/>
    <text x="40" y="47" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
    <text x="40" y="95" font-family="Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Share</text>
  </g>
  <!-- Title text -->
  <text x="400" y="375" font-family="Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="bold">How to Get Your UK Share Code</text>
</svg>